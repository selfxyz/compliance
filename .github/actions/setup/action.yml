# Python plus this repo's scripts, for the jobs of the reusable workflow.
# GitHub downloads the whole repo to run an action from it, so the scripts are on disk.
# Sets COMPLIANCE_ROOT to the repo root.
name: Compliance setup
description: Set up Python and point COMPLIANCE_ROOT at the compliance scripts.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with: { python-version: "3.12" }
    - shell: bash
      run: |
        pip install --quiet pyyaml==6.0.2 jsonschema==4.23.0
        echo "COMPLIANCE_ROOT=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)" >> "$GITHUB_ENV"
